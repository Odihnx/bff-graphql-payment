# Stubs del emisor de accesos locales (contrato K3, apertura local). Plugins remotos con versión
# fija: el resultado no depende de los protoc-gen-* instalados.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: bff-graphql-payment/gen/go/proto/localaccess

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go/proto/localaccess
    opt: paths=source_relative

  - remote: buf.build/grpc/go:v1.6.0
    out: gen/go/proto/localaccess
    opt: paths=source_relative
